<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Test - Testlancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/take-test.css">
</head>
<body>
    <div class="test-runner-layout">
        <!-- Top Sticky Header -->
        <header class="test-header">
            <div class="header-container">
                <div class="test-header-left">
                    <a href="/student" class="exit-btn" id="exit-test-btn" title="Exit Test">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </a>
                    <div>
                        <h1 class="test-main-title" id="test-title">Loading Test...</h1>
                        <span class="test-meta-badge" id="test-subject">Subject</span>
                    </div>
                </div>

                <div class="test-header-right">
                    <div class="timer-box" id="timer-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
                        <span id="time-remaining">00:00</span>
                    </div>
                    <button type="button" id="submit-header-btn" class="btn btn-primary btn-sm">Submit Test</button>
                </div>
            </div>
        </header>

        <!-- Test Body Area -->
        <main class="test-main-content">
            <!-- Sidebar: Question Navigator -->
            <aside class="test-sidebar">
                <h3 class="sidebar-title">Question Palette</h3>
                <div class="questions-palette" id="questions-palette">
                    <!-- Palette items injected via JS -->
                </div>
                <div class="palette-legend">
                    <div class="legend-item"><span class="dot answered"></span> Answered</div>
                    <div class="legend-item"><span class="dot current"></span> Current</div>
                    <div class="legend-item"><span class="dot unanswered"></span> Unanswered</div>
                </div>
            </aside>

            <!-- Question Card Area -->
            <section class="test-work-area">
                <div id="question-card" class="question-display-card">
                    <div class="question-top-bar">
                        <span class="question-seq" id="question-sequence">Question 1 of 10</span>
                        <span class="question-status-tag" id="question-status-tag">Unanswered</span>
                    </div>

                    <h2 class="question-text" id="question-text">Loading question text...</h2>

                    <div class="answers-list" id="answers-list">
                        <!-- Options injected via JS -->
                    </div>

                    <div class="question-footer-nav">
                        <button type="button" id="prev-question-btn" class="btn btn-outline" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            <span>Previous</span>
                        </button>
                        <button type="button" id="next-question-btn" class="btn btn-primary">
                            <span>Next</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </button>
                        <button type="button" id="finish-test-btn" class="btn btn-success" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                            <span>Finish & Submit</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Results Modal / Overlay -->
    <div id="result-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-dialog result-dialog">
            <div class="result-badge-icon" id="result-badge-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h2 class="result-title" id="result-title">Test Completed!</h2>
            <p class="result-subtitle" id="result-subtitle">Here is your final score summary</p>

            <div class="score-circle-container">
                <div class="score-value" id="score-percentage">0%</div>
                <div class="score-fraction" id="score-fraction">0 / 0 correct answers</div>
            </div>

            <div class="result-stats-row">
                <div class="result-stat-box">
                    <span class="stat-number text-green" id="correct-count">0</span>
                    <span class="stat-desc">Correct</span>
                </div>
                <div class="result-stat-box">
                    <span class="stat-number text-red" id="incorrect-count">0</span>
                    <span class="stat-desc">Incorrect</span>
                </div>
                <div class="result-stat-box">
                    <span class="stat-number text-indigo" id="time-spent">0m</span>
                    <span class="stat-desc">Time Spent</span>
                </div>
            </div>

            <div class="result-actions">
                <a href="/student" class="btn btn-primary" style="width: 100%;">Return to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="/static/take-test.js"></script>
</body>
</html>
