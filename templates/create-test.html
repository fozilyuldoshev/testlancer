<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create / Edit Test - Testlancer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/create-test.css">
</head>
<body>
    <div class="app-layout">
        <!-- Top Navbar -->
        <header class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="#4F46E5"/>
                        <path d="M12 20.5L17.5 26L28 15" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="brand-name">Testlancer</span>
                    <span class="badge teacher-badge">Test Builder</span>
                </div>
                
                <div class="nav-actions">
                    <a href="/teacher" class="btn btn-outline btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        <span>Back to Dashboard</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- Main Form Container -->
        <main class="main-content">
            <form id="test-form">
                <div class="content-header">
                    <div>
                        <h1 class="page-title" id="form-heading">Create New Test</h1>
                        <p class="page-subtitle">Define test parameters, instructions and configure multiple choice questions</p>
                    </div>
                    <div class="header-actions">
                        <a href="/teacher" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="save-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            <span>Save Test</span>
                        </button>
                    </div>
                </div>

                <!-- Test Details Card -->
                <div class="card form-card">
                    <h2 class="card-title">Test Details</h2>
                    <div class="form-grid">
                        <div class="form-group span-2">
                            <label for="test-title">Test Title <span class="required">*</span></label>
                            <input type="text" id="test-title" class="form-control" placeholder="e.g. Advanced JavaScript & Modern React Patterns" required>
                        </div>

                        <div class="form-group">
                            <label for="test-subject">Subject / Category <span class="required">*</span></label>
                            <input type="text" id="test-subject" class="form-control" placeholder="e.g. Web Development" required>
                        </div>

                        <div class="form-group">
                            <label for="test-duration">Duration (in minutes) <span class="required">*</span></label>
                            <input type="number" id="test-duration" class="form-control" min="1" max="300" value="30" required>
                        </div>

                        <div class="form-group">
                            <label for="test-status">Status</label>
                            <select id="test-status" class="form-control">
                                <option value="Active">Active (Available to students)</option>
                                <option value="Draft">Draft (Saved privately)</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>

                        <div class="form-group span-2">
                            <label for="test-description">Description & Guidelines</label>
                            <textarea id="test-description" class="form-control" rows="3" placeholder="Provide test instructions, topics covered, or rules..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Questions Builder Section -->
                <div class="questions-section">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Questions (<span id="question-count">0</span>)</h2>
                            <p class="section-subtitle">Add multiple-choice questions and mark the correct choice for each</p>
                        </div>
                        <button type="button" id="add-question-btn" class="btn btn-secondary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            <span>Add Question</span>
                        </button>
                    </div>

                    <div id="questions-container" class="questions-list">
                        <!-- Questions dynamically added here -->
                    </div>
                </div>

                <div class="form-bottom-actions">
                    <a href="/teacher" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary btn-lg">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        <span>Save & Publish Test</span>
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script src="/static/create-test.js"></script>
</body>
</html>
